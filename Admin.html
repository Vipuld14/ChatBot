<!DOCTYPE html>
<html>
<head>
  <title>ChatBot Admin</title>
  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #f4f4f4;
    }

    section {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    input {
      width: 70%;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
      cursor: pointer;
    }

    .url-item {
      margin-top: 10px;
      padding: 8px;
      background: #c7bebe;
      border-radius: 5px;
    }

    #log {
      width: 100%;
      height: 180px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>ChatBot Admin</h1>
  <p>Add sources and run vectorization.</p>

  <section>
    <h2>Sources</h2>
    <input type="text" id="urlInput" placeholder="Enter URL">
    <button onclick="addURL()">Add</button>

    <div id="urlList"></div>
  </section>

  <section>
    <h2>Vectorize</h2>
    <button id="runBtn" onclick="runVectorize()">Run Vectorize</button>
    <p id="status">Status: idle</p>
    <textarea id="log" readonly></textarea>
  </section>

  <script>
    const API = "http://localhost:5050/api";
    let poll;

    async function loadURLs() {
      const res = await fetch(API + "/sources");
      const urls = await res.json();

      const list = document.getElementById("urlList");
      list.innerHTML = "";

      if (urls.length === 0) {
        list.innerHTML = "<p>No sources yet</p>";
        return;
      }

      urls.forEach(url => {
        list.innerHTML += `
          <div class="url-item">
            ${url}
            <button onclick="removeURL('${url}')">Remove</button>
          </div>
        `;
      });
    }

    async function addURL() {
      const input = document.getElementById("urlInput");
      const url = input.value.trim();

      if (url === "") return;

      const res = await fetch(API + "/sources", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url })
      });

      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      input.value = "";
      loadURLs();
    }

    async function removeURL(url) {
      const res = await fetch(API + "/sources", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url })
      });

      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      loadURLs();
    }

    async function runVectorize() {
      await fetch(API + "/vectorize", { method: "POST" });
      document.getElementById("log").value = "";
      checkStatus();
    }

    function checkStatus() {
      poll = setInterval(async () => {
        const res = await fetch(API + "/vectorize/status");
        const data = await res.json();

        document.getElementById("log").value = data.log.join("\n");

        if (data.running) {
          document.getElementById("status").innerText = "Status: running";
          document.getElementById("runBtn").disabled = true;
        } else {
          document.getElementById("runBtn").disabled = false;

          if (data.success === true) {
            document.getElementById("status").innerText = "Status: success";
          } else if (data.success === false) {
            document.getElementById("status").innerText = "Status: failed";
          }

          clearInterval(poll);
        }
      }, 1000);
    }

    loadURLs();
  </script>

</body>
</html>
