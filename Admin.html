<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatBot Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #F5F5F5;
      padding: 2rem 1rem;
    }

    .page {
      max-width: 660px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 { font-size: 20px; color: #111; }
    h1 + p { font-size: 13px; color: #666; margin-top: 4px; }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .card h2 {
      font-size: 15px;
      color: #111;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 12px;
      color: #888;
      margin-bottom: 1rem;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .input-row input:focus { border-color: #185FA5; }
    .input-row input::placeholder { color: #aaa; }

    button {
      padding: 8px 16px;
      background: #185FA5;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover    { background: #0C447C; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    .url-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 0.75rem;
    }

    .url-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #F7F7F7;
      border-radius: 8px;
    }

    .url-text {
      flex: 1;
      font-size: 13px;
      font-family: monospace;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-rm {
      background: none;
      border: none;
      color: #999;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .url-rm:hover { color: #c0392b; }

    .empty { font-size: 13px; color: #aaa; margin-top: 0.5rem; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0.75rem 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }

    .dot.running { background: #185FA5; animation: pulse 1s infinite; }
    .dot.success { background: #3B6D11; }
    .dot.failed  { background: #A32D2D; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-row span { font-size: 13px; color: #666; }

    .log-box {
      background: #F7F7F7;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #555;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="page">

  <div>
    <h1>ChatBot Admin</h1>
    <p>Manage knowledge sources and rebuild the vector index.</p>
  </div>

  <div class="card">
    <h2>Sources</h2>
    <p>URLs used to build the knowledge base</p>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/page" onkeydown="if(event.key==='Enter') addURL()"/>
      <button onclick="addURL()">Add</button>
    </div>
    <div class="url-list" id="urlList"></div>
  </div>

  <div class="card">
    <h2>Vectorize</h2>
    <p>Scrape sources and rebuild the vector index</p>
    <button id="runBtn" onclick="runVectorize()">Run vectorize</button>
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <span id="statusLabel">Idle</span>
    </div>
    <div class="log-box" id="log"></div>
  </div>

</div>

<script>
  const API = "http://localhost:5050/api";
  let poll;

  async function loadURLs() {
    try {
      const res = await fetch(API + "/sources");
      const urls = await res.json();
      const list = document.getElementById("urlList");
      if (!urls.length) {
        list.innerHTML = '<p class="empty">No sources added yet.</p>';
        return;
      }
      list.innerHTML = urls.map(u => `
        <div class="url-row">
          <span class="url-text" title="${u}">${u}</span>
          <button class="url-rm" onclick="removeURL('${u}')">×</button>
        </div>`).join("");
    } catch {}
  }

  async function addURL() {
    const inp = document.getElementById("urlInput");
    const url = inp.value.trim();
    if (!url) return;
    try {
      const res = await fetch(API + "/sources", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      inp.value = "";
      loadURLs();
    } catch { alert("Could not reach the server."); }
  }

  async function removeURL(url) {
    try {
      const res = await fetch(API + "/sources", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      loadURLs();
    } catch {}
  }

  async function runVectorize() {
    await fetch(API + "/vectorize", { method: "POST" });
    document.getElementById("log").textContent = "";
    setStatus("running", "Running…");
    document.getElementById("runBtn").disabled = true;
    poll = setInterval(async () => {
      try {
        const res = await fetch(API + "/vectorize/status");
        const data = await res.json();
        const box = document.getElementById("log");
        box.textContent = data.log.join("\n");
        box.scrollTop = box.scrollHeight;
        if (!data.running) {
          document.getElementById("runBtn").disabled = false;
          clearInterval(poll);
          if (data.success === true)      setStatus("success", "Completed successfully");
          else if (data.success === false) setStatus("failed", "Failed — check log");
          else                             setStatus("", "Idle");
        }
      } catch { clearInterval(poll); }
    }, 1000);
  }

  function setStatus(state, label) {
    document.getElementById("dot").className = "dot " + state;
    document.getElementById("statusLabel").textContent = label;
  }

  loadURLs();
</script>

</body>
</html>
