<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GSU Academic Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #002147;
    --gold:   #C8A84B;
    --cream:  #F5F0E8;
    --dark:   #0A0E1A;
    --card:   #111827;
    --border: rgba(200,168,75,0.25);
    --text:   #E8E2D6;
    --muted:  #7A8499;
    --user-bg: #1A2340;
    --bot-bg:  #12191F;
  }

  html, body { height: 100%; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(200,168,75,0.08) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(200,168,75,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(200,168,75,0.03) 40px);
  }

  /* Header */
  header {
    width: 100%;
    max-width: 820px;
    padding: 2.5rem 2rem 1.5rem;
    text-align: center;
    animation: fadeDown 0.7s ease both;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 2rem;
    padding: 0.35rem 1rem;
    margin-bottom: 1.2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
  }

  .logo-badge span {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    color: #fff;
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  h1 em { color: var(--gold); font-style: normal; }

  .subtitle {
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* Chat Window */
  .chat-wrapper {
    width: 100%;
    max-width: 820px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 1.5rem 1.5rem;
    animation: fadeUp 0.7s 0.2s ease both;
  }

  #chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    padding: 1.5rem;
    background: rgba(10,14,26,0.6);
    border: 1px solid var(--border);
    border-radius: 1rem 1rem 0 0;
    min-height: 380px;
    max-height: 480px;
    scroll-behavior: smooth;
  }

  #chat-log::-webkit-scrollbar { width: 5px; }
  #chat-log::-webkit-scrollbar-track { background: transparent; }
  #chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .message {
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    animation: fadeUp 0.35s ease both;
  }

  .avatar {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .user-avatar { background: var(--gold); color: var(--dark); }
  .bot-avatar  { background: var(--navy); color: var(--gold); border: 1px solid var(--border); }

  .bubble {
    padding: 0.75rem 1.1rem;
    border-radius: 0.75rem;
    font-size: 0.92rem;
    line-height: 1.65;
    max-width: 88%;
  }

  .user-bubble {
    background: var(--user-bg);
    border: 1px solid rgba(200,168,75,0.15);
    border-top-left-radius: 0.2rem;
  }

  .bot-bubble {
    background: var(--bot-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-top-left-radius: 0.2rem;
  }

  /* Typing dots */
  .typing-dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* Input Bar */
  .input-bar {
    display: flex;
    background: rgba(10,14,26,0.8);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 1rem 1rem;
    overflow: hidden;
  }

  #question-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 1rem 1.25rem;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.92rem;
    color: var(--text);
  }

  #question-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--gold);
    color: var(--dark);
    border: none;
    padding: 0 1.5rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  #send-btn:hover   { background: #d4b05e; }
  #send-btn:active  { transform: scale(0.97); }
  #send-btn:disabled { background: #4a3e1a; color: #7a6830; cursor: not-allowed; }

  /* Suggestion chips */
  .suggestions {
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .suggestion-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.78rem;
    padding: 0.4rem 0.85rem;
    border-radius: 2rem;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }

  .suggestion-chip:hover {
    color: var(--gold);
    border-color: var(--gold);
    background: rgba(200,168,75,0.06);
  }

  /* Animations */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px);  } to { opacity:1; transform:none; } }
  @keyframes bounce   { 0%,80%,100% { transform:scale(0); } 40% { transform:scale(1); } }
  @keyframes pulse    { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
</style>
</head>
<body>

<header>
  <div class="logo-badge"><span></span> Georgia State University</div>
  <h1>Academic <em>Assistant</em></h1>
  <p class="subtitle">Ask anything about GSU programs, requirements, and courses.</p>
</header>

<div class="chat-wrapper">
  <div id="chat-log">
    <div class="message">
      <div class="avatar bot-avatar">GSU</div>
      <div class="bubble bot-bubble">
        Hello! I'm your GSU Academic Assistant. Ask me about Computer Science programs, admission requirements, course credit hours, and more.
      </div>
    </div>
  </div>

  <div class="input-bar">
    <input id="question-input" type="text" placeholder="Ask about GSU programs…" autocomplete="off"/>
    <button id="send-btn">Send</button>
  </div>

  <div class="suggestions">
    <button class="suggestion-chip" onclick="fillAndSend(this)">CS BS admission requirements</button>
    <button class="suggestion-chip" onclick="fillAndSend(this)">Credit hours for CS MS</button>
    <button class="suggestion-chip" onclick="fillAndSend(this)">Core CS undergrad courses</button>
    <button class="suggestion-chip" onclick="fillAndSend(this)">CS program tuition</button>
  </div>
</div>

<script>
  const log   = document.getElementById('chat-log');
  const input = document.getElementById('question-input');
  const btn   = document.getElementById('send-btn');

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'message';
    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}-avatar`;
    avatar.textContent = role === 'user' ? 'YOU' : 'GSU';
    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}-bubble`;
    bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message';
    wrap.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot-avatar';
    avatar.textContent = 'GSU';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot-bubble typing-dots';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendQuestion() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    btn.disabled = true;

    addMessage('user', q);
    addTyping();

    try {
      const res  = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      removeTyping();
      addMessage('bot', data.answer || "I don't know.");
    } catch {
      removeTyping();
      addMessage('bot', 'Sorry, something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  function fillAndSend(chip) {
    input.value = chip.textContent;
    sendQuestion();
  }

  btn.addEventListener('click', sendQuestion);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });
</script>
</body>
</html>
