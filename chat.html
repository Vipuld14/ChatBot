<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GSU ChatBot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #EEF4F9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 600;
    color: #0B2540;
  }

  header p {
    font-size: 14px;
    color: #6B8BAD;
    margin-top: 4px;
  }

  .chat-box {
    width: 100%;
    max-width: 680px;
    background: white;
    border-radius: 16px;
    border: 1px solid #D4E5F5;
    overflow: hidden;
  }

  #chat-log {
    height: 420px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .av {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 9px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .msg.bot .av  { background: #D8E9F8; color: #1659A8; }
  .msg.user .av { background: #0B2540; color: white; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .msg.bot .bubble  { background: #F4F8FD; border: 1px solid #D4E5F5; color: #0B2540; border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: #1659A8; color: white; border-bottom-right-radius: 4px; }

  .dots { display: flex; gap: 4px; padding: 3px 0; }
  .dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #1659A8;
    animation: blink 1s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #D4E5F5;
    background: #FAFCFF;
  }

  .input-row input {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid #D4E5F5;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    color: #0B2540;
    outline: none;
  }

  .input-row input:focus { border-color: #1659A8; }
  .input-row input::placeholder { color: #AAC0D8; }

  .input-row button {
    padding: 9px 18px;
    background: #1659A8;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .input-row button:hover    { background: #0B2540; }
  .input-row button:disabled { background: #AAC0D8; cursor: not-allowed; }

  .chips {
    width: 100%;
    max-width: 680px;
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chips button {
    padding: 7px 14px;
    background: white;
    border: 1px solid #D4E5F5;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    color: #6B8BAD;
    cursor: pointer;
  }

  .chips button:hover { background: #D8E9F8; color: #1659A8; }
</style>
</head>
<body>

<header>
  <h1>GSU ChatBot</h1>
  <p>Ask me anything about GSU programs, admissions, and courses.</p>
</header>

<div class="chat-box">
  <div id="chat-log"></div>
  <div class="input-row">
    <input type="text" id="question-input" placeholder="Ask a question…" onkeydown="if(event.key==='Enter') send()"/>
    <button id="send-btn" onclick="send()">Send</button>
  </div>
</div>

<div class="chips">
  <button onclick="suggest(this)">What CS programs does GSU offer?</button>
  <button onclick="suggest(this)">How do I apply to the MS program?</button>
  <button onclick="suggest(this)">What are the CS degree requirements?</button>
  <button onclick="suggest(this)">What is CSC 1301?</button>
</div>

<script>
  const API = "https://whisking-sensation-tartness.ngrok-free.dev/api";

  function addMessage(role, content) {
    const log = document.getElementById("chat-log");
    const row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");

    if (role === "typing") {
      row.id = "typing-msg";
      row.innerHTML = `<div class="av">AI</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    } else {
      const label = role === "user" ? "YOU" : "AI";
      row.innerHTML = `<div class="av">${label}</div><div class="bubble">${esc(content)}</div>`;
    }

    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-msg");
    if (el) el.remove();
  }

  async function send() {
    const input = document.getElementById("question-input");
    const btn   = document.getElementById("send-btn");
    const query = input.value.trim();
    if (!query || btn.disabled) return;

    input.value = "";
    btn.disabled = true;
    addMessage("user", query);
    addMessage("typing");

    try {
      const res  = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      removeTyping();

      let text = data.answer || data.error || "No response.";
      if (data.sources && data.sources.length > 0) {
        text += "\n\nSources:";
        data.sources.forEach(url => { text += "\n• " + url; });
      }

      addMessage("bot", text);
    } catch {
      removeTyping();
      addMessage("bot", "Could not reach the server. Make sure the backend is running.");
    }

    btn.disabled = false;
    input.focus();
  }

  function suggest(btn) {
    document.getElementById("question-input").value = btn.textContent;
    send();
  }

  function esc(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
  }

  addMessage("bot", "Hi! Ask me anything about GSU programs, admissions, or courses.");
</script>

</body>
</html>
